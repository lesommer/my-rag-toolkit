[project]
name = "my-rag-toolkit"
version = "0.1.0"
description = "Local-first RAG toolkit for sensitive documents: local parsing/chunking/embeddings + retrieval on-device, generation via the sovereign Albert API (DINUM)."
requires-python = ">=3.12,<3.14"
dependencies = [
    "chromadb>=1.0,<2",
    "sentence-transformers>=3.3",
    "tiktoken>=0.8",
    "openai>=1.50",
    "typer>=0.12",
    "rich>=13",
    "streamlit>=1.40",
    "pyyaml>=6.0",
    "python-docx>=1.1",
    "pymupdf>=1.24",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
rag = "myrag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/myrag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
